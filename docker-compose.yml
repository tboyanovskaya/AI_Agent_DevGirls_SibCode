services:
  backend:
    build: .
    image: myproject:latest
    container_name: agent-backend
    command: ["uvicorn", "fast_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 60s

  frontend:
    build: .
    image: myproject:latest
    container_name: agent-frontend
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped